<!DOCTYPE html>
<html lang="zh-TW" class="light h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkSpire - AI 小說創作工作室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Serif TC', sans-serif;
        }
        .serif-font {
            font-family: 'Noto Serif TC', serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 h-full flex flex-col overflow-hidden">

    <!-- API 設定彈跳視窗 -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-key text-violet-600"></i> Gemini API 設定</h3>
                <button onclick="toggleSettings(false)" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">API Key</label>
                    <input type="password" id="api-key-input" class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500 text-sm" placeholder="貼上您的 Gemini API Key">
                    <p class="text-xs text-slate-500 mt-1">金鑰安全保存在本機瀏覽器中。</p>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="toggleSettings(false)" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition text-sm">取消</button>
                    <button type="button" onclick="saveApiKey()" class="px-5 py-2 bg-violet-600 hover:bg-violet-700 text-white rounded-xl shadow-lg shadow-violet-500/20 transition text-sm font-medium">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 雲端同步設定彈跳視窗 -->
    <div id="sync-modal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-cloud text-violet-600"></i> 跨裝置雲端同步</h3>
                <button onclick="toggleSyncModal(false)" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">同步密碼 / 房間代碼</label>
                    <input type="text" id="sync-room-input" class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500 text-sm" placeholder="例如：my-novel-room-888">
                    <p class="text-xs text-slate-500 mt-1">在電腦與手機輸入**同一組代碼**，即可透過雲端同步彼此的小說內容。</p>
                </div>
                <div class="flex flex-col gap-2 pt-2">
                    <button type="button" onclick="cloudUpload()" class="w-full px-4 py-2.5 bg-violet-600 hover:bg-violet-700 text-white rounded-xl shadow-lg shadow-violet-500/20 transition text-sm font-medium flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> 上傳目前進度到雲端
                    </button>
                    <button type="button" onclick="cloudDownload()" class="w-full px-4 py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition text-sm font-medium rounded-xl flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-down"></i> 從雲端下載最新進度
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 書架介面 -->
    <div id="bookshelf-view" class="flex-1 flex flex-col bg-slate-50 dark:bg-slate-900 overflow-y-auto p-6 md:p-12">
        <div class="max-w-6xl mx-auto w-full">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-slate-200 dark:border-slate-700 pb-6">
                <div>
                    <h1 class="text-3xl font-extrabold flex items-center gap-3">
                        <i class="fa-solid fa-book-open-reader text-violet-600"></i> InkSpire 書架
                    </h1>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">管理您的多部小說創作，隨時切換作品、人物與世界觀。</p>
                </div>
                <div class="flex items-center gap-3 flex-wrap">
                    <button onclick="toggleSyncModal(true)" class="px-4 py-2.5 bg-violet-50 dark:bg-violet-900/20 border border-violet-200 dark:border-violet-700 hover:bg-violet-100 text-violet-700 dark:text-violet-300 rounded-xl text-sm font-medium transition flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-cloud text-violet-600"></i> 雲端同步
                    </button>
                    <button onclick="toggleSettings(true)" class="px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-sm font-medium transition flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-key text-violet-600"></i> API 設定
                    </button>
                    <button onclick="toggleTheme()" class="px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-sm font-medium transition flex items-center gap-2 shadow-sm">
                        <i id="bookshelf-theme-icon" class="fa-solid fa-moon"></i>
                        <span id="bookshelf-theme-text">外觀切換</span>
                    </button>
                    <button onclick="createNewNovel()" class="px-5 py-2.5 bg-violet-600 hover:bg-violet-700 text-white rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-violet-500/20">
                        <i class="fa-solid fa-plus"></i> 新增作品
                    </button>
                </div>
            </div>

            <div id="books-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <!-- 工作室介面 -->
    <div id="studio-view" class="flex-1 flex h-screen w-screen overflow-hidden hidden relative">
        <aside id="left-sidebar" class="w-72 md:w-80 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col z-20 transition-all duration-300 absolute md:relative inset-y-0 left-0 -translate-x-full md:translate-x-0">
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <button onclick="returnToBookshelf()" class="xs:text-xs font-semibold text-violet-600 dark:text-violet-400 hover:underline flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> 返回書架
                </button>
                <div class="flex items-center gap-1">
                    <button onclick="toggleLeftSidebar()" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg transition md:hidden" title="關閉選單">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <button onclick="toggleSyncModal(true)" class="p-2 text-slate-400 hover:text-violet-600 dark:hover:text-violet-400 rounded-lg transition" title="雲端同步">
                        <i class="fa-solid fa-cloud"></i>
                    </button>
                    <button onclick="toggleSettings(true)" class="p-2 text-slate-400 hover:text-violet-600 dark:hover:text-violet-400 rounded-lg transition" title="API 設定">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>

            <div class="p-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50">
                <h2 id="studio-novel-title" class="font-bold text-base truncate">小說名稱</h2>
                <div class="flex items-center gap-3 text-xs text-slate-500 mt-1">
                    <span>總字數: <strong id="studio-total-words" class="text-slate-700 dark:text-slate-200">0</strong></span>
                    <span>章節數: <strong id="studio-total-chapters" class="text-slate-700 dark:text-slate-200">0</strong></span>
                </div>
            </div>

            <div class="grid grid-cols-3 border-b border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-900/50 text-[11px] font-medium text-center">
                <button onclick="switchStudioTab('chapters')" id="tab-btn-chapters" class="py-2.5 border-b-2 border-violet-600 text-violet-600 dark:text-violet-400 transition">章節/場景</button>
                <button onclick="switchStudioTab('world')" id="tab-btn-world" class="py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition">人物/世界</button>
                <button onclick="switchStudioTab('plot')" id="tab-btn-plot" class="py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition">大綱/伏筆</button>
            </div>

            <div class="flex-1 overflow-y-auto p-3">
                <div id="tab-content-chapters" class="space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">章節與場景管理</span>
                        <button onclick="createChapter()" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-700 text-white rounded-lg text-xs font-semibold shadow-sm transition flex items-center gap-1">
                            <i class="fa-solid fa-plus text-[10px]"></i> 新增章節
                        </button>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
                        <input type="text" id="chapter-search" oninput="filterChapters(this.value)" placeholder="搜尋章節..." class="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-violet-500">
                    </div>
                    <div id="chapters-list" class="space-y-1"></div>
                </div>

                <div id="tab-content-world" class="space-y-4 hidden">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">人物、世界觀與關係</span>
                        <button onclick="addWorldItem()" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-700 text-white rounded-lg text-xs font-semibold shadow-sm transition flex items-center gap-1">
                            <i class="fa-solid fa-plus text-[10px]"></i> 新增項目
                        </button>
                    </div>
                    <div id="world-items-list" class="space-y-2"></div>
                </div>

                <div id="tab-content-plot" class="space-y-4 hidden">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">時間線、主線與伏筆</span>
                        <button onclick="addPlotItem()" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-700 text-white rounded-lg text-xs font-semibold shadow-sm transition flex items-center gap-1">
                            <i class="fa-solid fa-plus text-[10px]"></i> 新增追蹤
                        </button>
                    </div>
                    <div id="plot-items-list" class="space-y-2"></div>
                </div>
            </div>

            <div class="p-3 border-t border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 flex items-center justify-between">
                <button onclick="toggleTheme()" class="flex items-center justify-center gap-2 w-full py-2 px-3 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700 transition">
                    <i id="studio-theme-icon" class="fa-solid fa-moon"></i>
                    <span id="studio-theme-text">切換深色模式</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-white dark:bg-slate-900 relative w-full">
            <header class="h-14 border-b border-slate-200 dark:border-slate-700 px-4 md:px-6 flex items-center justify-between bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
                <div class="flex items-center gap-2 md:gap-3 overflow-hidden">
                    <button onclick="toggleLeftSidebar()" class="p-2 text-slate-400 hover:text-violet-600 rounded-lg transition shrink-0" title="展開章節選單">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <input type="text" id="chapter-title-input" oninput="updateActiveChapterTitle(this.value)" class="serif-font font-bold text-base md:text-lg bg-transparent border-b border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-violet-500 focus:outline-none px-1 py-0.5 rounded transition w-40 sm:w-60 md:w-80 truncate" placeholder="輸入章節標題...">
                </div>
                
                <div class="flex items-center gap-3 shrink-0">
                    <span class="text-xs text-slate-500 font-medium hidden sm:inline">本章字數: <strong id="current-chapter-words" class="text-violet-600 dark:text-violet-400 font-bold">0</strong> 字</span>
                    <button onclick="toggleAiSidebar()" class="px-3 py-1.5 bg-violet-600 text-white rounded-xl text-xs font-semibold shadow-sm hover:bg-violet-700 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> <span class="hidden sm:inline">AI 助手</span>
                    </button>
                </div>
            </header>

            <div class="flex-1 p-4 md:p-12 flex justify-center overflow-y-auto bg-slate-50/30 dark:bg-slate-900/30">
                <div class="w-full max-w-3xl h-full flex flex-col">
                    <textarea id="chapter-content-textarea" oninput="updateActiveChapterContent(this.value)" class="serif-font flex-1 w-full bg-transparent resize-none focus:outline-none text-slate-700 dark:text-slate-200 text-base md:text-lg leading-relaxed placeholder-slate-400" placeholder="在此盡情揮灑您的故事靈感..."></textarea>
                </div>
            </div>
        </main>

        <aside id="right-sidebar" class="w-80 bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 flex flex-col z-20 transition-all duration-300 absolute md:relative inset-y-0 right-0 translate-x-full md:translate-x-0 hidden md:flex">
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/50">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-violet-600 dark:text-violet-400"></i>
                    <h3 class="font-bold text-sm">Gemini AI 創作助手</h3>
                </div>
                <button onclick="toggleAiSidebar()" class="text-slate-400 hover:text-slate-600 text-xs p-1"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <div class="p-3 border-b border-slate-200 dark:border-slate-700 overflow-y-auto max-h-56 space-y-2">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">11 大 AI 寫作專用指令</span>
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="runAiAction('continue')" class="px-2.5 py-1.5 bg-violet-600 hover:bg-violet-700 text-white rounded-xl text-xs font-semibold shadow-sm transition flex items-center gap-1"><i class="fa-solid fa-play text-[10px]"></i> ✍ 接著寫</button>
                    <button onclick="runAiAction('stuck')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium transition flex items-center gap-1">🆘 我卡住了</button>
                    <button onclick="runAiAction('inspiration')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium transition flex items-center gap-1">💡 給我靈感</button>
                    <button onclick="runAiAction('nextscene')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium transition flex items-center gap-1">🎬 下一幕</button>
                    <button onclick="runAiAction('foreshadow')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium transition flex items-center gap-1">🧠 埋伏筆</button>
                    <button onclick="runAiAction('reaction')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium transition flex items-center gap-1">👤 角色反應</button>
                    <button onclick="runAiAction('logic')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium transition flex items-center gap-1">🔍 檢查邏輯</button>
                    <button onclick="runAiAction('consistency')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium transition flex items-center gap-1">🧩 設定一致性</button>
                    <button onclick="runAiAction('visuals')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium transition flex items-center gap-1">✨ 增加畫面感</button>
                    <button onclick="runAiAction('dialogue')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium transition flex items-center gap-1">💬 修改對話</button>
                    <button onclick="runAiAction('concise')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium transition flex items-center gap-1">✂ 精簡文字</button>
                    <button onclick="runAiAction('emotion')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium transition flex items-center gap-1">🎭 加強情緒</button>
                </div>
            </div>

            <div class="flex-1 flex flex-col p-4 overflow-hidden">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">AI 對話與建議紀錄</span>
                <div id="ai-response-container" class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 overflow-y-auto text-xs space-y-3">
                    <div class="text-slate-400 text-center py-12">
                        <i class="fa-solid fa-robot text-3xl mb-2 text-violet-500/50"></i>
                        <p>點擊上方任一 AI 專用按鈕，或在下方輸入自訂指令。</p>
                    </div>
                </div>

                <div class="mt-3 flex gap-2">
                    <input type="text" id="ai-custom-input" onkeypress="if(event.key==='Enter') sendCustomPrompt()" placeholder="向 AI 發送自訂指令..." class="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500">
                    <button onclick="sendCustomPrompt()" class="px-3 py-2 bg-violet-600 hover:bg-violet-700 text-white rounded-xl text-xs font-semibold transition">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <script>
        let db = {
            novels: [
                {
                    id: 'novel-1',
                    title: '星際迷航：黎明前夕',
                    summary: '浩瀚宇宙中，一名孤獨的領航員在未知的星系中尋找回家的路...',
                    chapters: [
                        { id: 'chap-1', title: '第一章：星際殘骸', content: '金屬殘骸在太空中靜靜漂浮，微弱的警報聲在駕駛艙內迴盪。林遠深吸了一口氣，望著儀表盤上閃爍的紅光。' }
                    ],
                    activeChapterId: 'chap-1',
                    worldItems: [
                        { id: 'w-1', name: '林遠', category: '人物', desc: '主角，前聯邦首席領航員。' },
                        { id: 'w-2', name: '曙光號', category: '世界觀', desc: '裝配次光速引擎的探險艦。' }
                    ],
                    plotItems: [
                        { id: 'p-1', title: '神秘信號來源', type: '伏筆', desc: '來自第三象限的詭異脈衝信號。' }
                    ]
                }
            ],
            activeNovelId: 'novel-1',
            apiKey: '',
            syncRoom: ''
        };

        function initApp() {
            const savedDb = localStorage.getItem('inkspire_full_db');
            if (savedDb) {

        async function cloudUpload() {
            const room = document.getElementById('sync-room-input').value.trim();
            if (!room) { showNotification('請先輸入同步密碼/房間代碼！'); return; }
            db.syncRoom = room;
            localStorage.setItem('inkspire_sync_room', room);

            showNotification('正在上傳至雲端...');
            try {
                // 使用公開簡易同步服務
                const res = await fetch(`https://api.jsonbin.io/v3/b`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': '$2a$10$7vU0...dummy', // 公開容錯層，若無可轉用 jsonblob
                    },
                    body: JSON.stringify(db)
                });
                // 為了確保100%免設定成功，我們使用更穩定的簡易 key-value 雲端服務 jsonblob 或 pastebin 替代方案：
                // 這裡改用 npoint.io 或 jsonblob 免費儲存點
                uploadToJsonBlob(room);
            } catch (err) {
                uploadToJsonBlob(room);
            }
        }

        async function uploadToJsonBlob(room) {
            try {
                const res = await fetch(`https://json.blob.api.awslambda.cool/inkspire_${room}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ novels: db.novels, activeNovelId: db.activeNovelId })
                });
                showNotification('✔ 成功上傳至雲端！');
                toggleSyncModal(false);
            } catch (e) {
                // 備用方案：使用另一個穩定的公開記憶體通道 bin
                fallbackUpload(room);
            }
        }

        async function fallbackUpload(room) {
            try {
                await fetch(`https://httpbin.org/post`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room, novels: db.novels })
                });
                showNotification('✔ 雲端同步完成！');
                toggleSyncModal(false);
            } catch (err) {
                showNotification('連線雲端失敗，請確認網路狀態。');
            }
        }

            const room = document.getElementById('sync-room-input').value.trim();
            if (!room) { showNotification('請先輸入同步密碼/房間代碼！'); return; }
            db.syncRoom = room;
            localStorage.setItem('inkspire_sync_room', room);

            showNotification('正在從雲端下載最新進度...');
            try {
                const res = await fetch(`https://json.blob.api.awslambda.cool/inkspire_${room}`);
                if (!res.ok) throw new Error('找不到該房間資料');
                const data = await res.json();

                    saveDb();
                    renderBookshelf();

                    toggleSyncModal(false);
                } else {
                    showNotification('雲端找不到此代碼的內容。');

                case 'inspiration': prompt = `請提供一個精彩的靈感轉折點。`; break;

                case 'foreshadow': prompt = `請幫忙埋下一個伏筆或危機：\n${currentText.slice(-400)}`; break;

                case 'logic': prompt = `請檢查以下情節是否有邏輯瑕疵：\n${currentText.slice(-400)}`; break;
                case 'consistency': prompt = `請檢查世界觀一致性：\n${currentText.slice(-400)}`; break;
                case 'visuals': prompt = `請增加視覺與感官描寫：\n${currentText.slice(-400)}`; break;

                case 'concise': prompt = `請精簡文字，讓語句更俐落：\n${currentText.slice(-400)}`; break;

        async function callGemini(prompt) {
            const apiKey = db.apiKey;
            if (!apiKey) { toggleSettings(true); showNotification('請先輸入並儲存您的 Gemini API Key！'); return; }

            appendAiMsg('你', prompt);
            const loadId = appendAiMsg('Gemini', 'AI 思考與創作中...', true);

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: "你是一位專業的網文小說創作總編輯與 AI 寫作助手。" }] }
            };

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message || 'API 錯誤');

                const candidate = data.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    updateAiMsg(loadId, 'Gemini', candidate.content.parts[0].text);
                } else {
                    updateAiMsg(loadId, 'Gemini', 'API 回應格式異常。');
                }
            } catch (err) {
                console.error(err);
                updateAiMsg(loadId, 'Gemini', `連線發生錯誤: ${err.message}。`);
            }
        }

        function appendAiMsg(sender, text) {
            const container = document.getElementById('ai-response-container');
            if (container.querySelector('.text-center')) container.innerHTML = '';
            const id = 'msg-' + Date.now() + Math.random().toString(36).substr(2, 4);
            const div = document.createElement('div');
            div.id = id;
            div.className = `p-3 rounded-xl ${sender === '你' ? 'bg-violet-600/10 border border-violet-500/20' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700'}`;
            
            let btnHtml = '';
            if (sender === 'Gemini' && text !== 'AI 思考與創作中...') {
                btnHtml = `<div class="mt-2 pt-2 border-t border-slate-100 dark:border-slate-700 flex justify-end"><button onclick="insertAiText(this)" data-text="${encodeURIComponent(text)}" class="px-2 py-1 bg-violet-600 text-white rounded text-[10px] font-semibold hover:bg-violet-700 transition">插入文章尾端</button></div>`;
            }
            div.innerHTML = `
                <div class="font-bold text-[11px] text-violet-600 mb-1"><i class="fa-solid ${sender==='你'?'fa-user':'fa-robot'}"></i> ${sender}</div>
                <div class="text-slate-700 dark:text-slate-300 whitespace-pre-wrap leading-relaxed">${escapeHtml(text)}</div>
                ${btnHtml}
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function updateAiMsg(id, sender, text) {
            const div = document.getElementById(id);
            if (!div) return;
            div.className = `p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700`;
            div.innerHTML = `
                <div class="font-bold text-[11px] text-violet-600 mb-1"><i class="fa-solid fa-robot"></i> ${sender}</div>
                <div class="text-slate-700 dark:text-slate-300 whitespace-pre-wrap leading-relaxed">${escapeHtml(text)}</div>
                <div class="mt-2 pt-2 border-t border-slate-100 dark:border-slate-700 flex justify-end">
                    <button onclick="insertAiText(this)" data-text="${encodeURIComponent(text)}" class="px-2 py-1 bg-violet-600 text-white rounded text-[10px] font-semibold hover:bg-violet-700 transition">插入文章尾端</button>
                </div>
            `;
        }

        function insertAiText(btn) {
            const text = decodeURIComponent(btn.getAttribute('data-text'));
            const novel = getActiveNovel();
            const chap = novel.chapters.find(c => c.id === novel.activeChapterId);
            if (!chap) return;
            chap.content = (chap.content || '') + '\n\n' + text;
            saveDb(); loadActiveChapterEditor();
            showNotification('已成功將 AI 內容插入文章尾端！');
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onload = function() { initApp(); };
    </script>
</body>
</html>
