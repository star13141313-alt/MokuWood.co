<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ormkub 會員專區</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #fcfaf5; margin: 0; padding-bottom: 70px; }
        .tab-content { display: none; padding: 20px; }
        .active { display: block; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-link { display: block; background: #06C755; color: white; text-align: center; padding: 15px; border-radius: 8px; text-decoration: none; margin-bottom: 10px; font-weight: bold; }
        nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #eee; }
    </style>
</head>
<body>

    <!-- 首頁 -->
    <div id="home" class="tab-content active">
        <h2>Hello, <span id="user-name">...</span></h2>
        <div class="card">
            <h3>熱門下單連結</h3>
            <!-- 這裡是你的 2-3 個連結 -->
            <a href="https://your-google-form-1.com" class="btn-link">🔥 本月團購 A 連結</a>
            <a href="https://your-google-form-2.com" class="btn-link">📦 預購商品 B 連結</a>
            <a href="https://your-google-form-3.com" class="btn-link">📢 客服諮詢/表單</a>
        </div>
    </div>

    <!-- 其他分頁 (訂單、資料等) -->
    <div id="orders" class="tab-content">...訂單內容...</div>
    <div id="profile" class="tab-content">...個人資料...</div>

    <!-- 導覽列 -->
    <nav>
        <div onclick="showTab('home')">首頁</div>
        <div onclick="showTab('orders')">訂單</div>
        <div onclick="showTab('profile')">資料</div>
    </nav>

    <script>
        const LIFF_ID = "2011022087-236uTcYQ";
        
        async function initLiff() {
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                document.getElementById('user-name').innerText = profile.displayName;
            } else {
                liff.login();
            }
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        initLiff();
    </script>
</body>
</html>
