<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>肆木代購｜會員專區</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-50 p-4">
  <div id="app" class="max-w-md mx-auto">
    <h1 class="text-xl font-bold mb-4">肆木代購會員資料</h1>
    <div id="content" class="bg-white p-4 rounded-lg shadow">資料載入中...</div>
  </div>

  <script>
    // 【請把下面引號內的網址換成你剛剛重新部署的 GAS 網址】
    const GAS_URL = "https://script.google.com/macros/s/你的網址/exec";

    async function init() {
      await liff.init({ liffId: "2011022087-236uTcYQ" });
      if (!liff.isLoggedIn()) { liff.login(); }
      else {
        const profile = await liff.getProfile();
        fetchData(profile.userId);
      }
    }

    function fetchData(lineId) {
      fetch(`${GAS_URL}?action=getProgress`)
        .then(res => res.json())
        .then(res => {
          document.getElementById('content').innerHTML = `成功載入 ${res.data.length} 筆資料`;
          console.log(res.data);
        })
        .catch(err => { document.getElementById('content').innerHTML = "讀取失敗：" + err; });
    }
    init();
  </script>
</body>
</html>
