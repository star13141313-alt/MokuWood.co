<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>肆木代購｜MokuWood.co 會員專區</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .filter-btn.active { background-color: #7C6F9D !important; color: #ffffff !important; border-color: #7C6F9D !important; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body style="background-color: #f9f8f3;" class="text-gray-800 text-sm antialiased min-h-screen py-6 px-4 pb-24">
  <div class="max-w-xl mx-auto space-y-5">
    
    <div class="bg-white/90 border border-white/60 rounded-2xl p-4 shadow-sm flex justify-between items-center">
        <div>
            <h2 id="user-name" class="font-bold text-base text-gray-900">Hello, 載入中...</h2>
            <p class="text-xs text-gray-500">肆木代購｜MokuWood.co 會員專區</p>
        </div>
        <button onclick="location.reload()" class="bg-gray-100 text-gray-600 text-xs px-3 py-1.5 rounded-lg">🔄 更新</button>
    </div>

    <!-- 1. 首頁 -->
    <div id="home" class="tab-content active space-y-4">
        <div class="bg-white/90 border border-white/60 rounded-3xl p-5 shadow-sm text-xs space-y-2 text-gray-600 leading-relaxed">
            <p style="color: #8C7BAE;" class="font-bold text-sm mb-2">💡 購賣須知與使用說明</p>
            <p>📢 本頁面進度會不定時更新，請善用下方分類篩選。</p>
            <p>📦 當商品抵台準備寄出時，請依照最新公告點選「填寫賣貨便」提交收件資訊。<p>
            <p>💬 若有疑問，歡迎聯繫官方 LINE：@wrg3112r</p>
        </div>
        <div id="filter-buttons" class="flex flex-wrap gap-2"></div>
        <div id="card-container" class="space-y-4"></div>
    </div>

    <!-- 2. 賣場 -->
    <div id="shop" class="tab-content space-y-4">
        <div class="bg-white border rounded-3xl p-5 shadow-sm">
            <h3 class="font-bold text-base text-gray-900 border-b pb-2 mb-3">🛒 本期快速下單專區</h3>
            <div id="shop-list" class="space-y-2"></div>
        </div>
    </div>

    <!-- 3. 訂單記錄 -->
    <div id="orders" class="tab-content space-y-4">
        <div class="bg-white border rounded-3xl p-5 shadow-sm">
            <h3 class="font-bold text-base text-gray-900 border-b pb-2 mb-3">📋 我的訂單記錄</h3>
            <div id="order-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- 4. 會員資料 -->
    <div id="profile" class="tab-content space-y-4">
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-3xl p-6 shadow-md">
            <p class="text-[10px] text-slate-400 uppercase font-semibold">MEMBER NAME</p>
            <p id="card-name" class="text-xl font-bold mt-0.5">載入中...</p>
        </div>

        <div id="member-info-section" class="hidden bg-white border rounded-3xl p-5 shadow-sm space-y-3 text-xs">
            <div class="flex justify-between py-2 border-b"><span class="text-gray-400">Email</span><span id="info-email" class="font-bold">--</span></div>
            <div class="flex justify-between py-2 border-b"><span class="text-gray-400">手機號碼</span><span id="info-phone" class="font-bold">--</span></div>
            <div class="flex justify-between py-2 border-b"><span class="text-gray-400">收件人</span><span id="info-recipient" class="font-bold">--</span></div>
            <div class="flex justify-between py-2"><span class="text-gray-400">取貨門市</span><span id="info-store" class="font-bold">--</span></div>
        </div>

        <div id="bind-section" class="hidden bg-white border rounded-3xl p-6 shadow-sm space-y-4">
            <p class="text-center font-bold text-sm">✨ 首次登入會員綁定</p>
            <input type="tel" id="bind-phone-input" placeholder="請輸入手機號碼 (例如 0912345678)" class="w-full px-4 py-3 border rounded-xl">
            <button onclick="submitBinding()" class="w-full py-3 bg-[#7C6F9D] text-white font-bold rounded-xl">確認綁定身分</button>
        </div>
    </div>
  </div>

  <nav class="fixed bottom-0 left-0 w-full bg-white/90 border-t flex justify-around py-3 z-50">
      <div onclick="showTab('home')" class="cursor-pointer text-xs font-bold text-[#7C6F9D]">首頁</div>
      <div onclick="showTab('shop')" class="cursor-pointer text-xs text-gray-400">賣場</div>
      <div onclick="showTab('orders')" class="cursor-pointer text-xs text-gray-400">訂單</div>
      <div onclick="showTab('profile')" class="cursor-pointer text-xs text-gray-400">會員資料</div>
  </nav>

  <script>
    const LIFF_ID = "2011022087-236uTcYQ";
    // 請確認下方連結是您的 GAS 部署網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz3H5WM7daQSxXyA9FR1RtMPMpfXVlYDMz6zpco48cXulIeauM006DMhfaRccLqNFo-/exec";

    let currentLineId = "";

    async function initLiff() {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        const profile = await liff.getProfile();
        currentLineId = profile.userId;
        document.getElementById('user-name').innerText = "Hello, " + profile.displayName;
        loadPageData();
    }

    function loadPageData() {
        // 載入會員資料
        fetch(`${GAS_URL}?action=getMember&lineId=${currentLineId}`)
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    document.getElementById('card-name').innerText = res.data.姓名 || '未填寫';
                    document.getElementById('info-email').innerText = res.data.Email || '-';
                    document.getElementById('info-phone').innerText = res.data.電話 || '-';
                    document.getElementById('info-recipient').innerText = res.data.收件人 || '-';
                    document.getElementById('info-store').innerText = res.data.收件門市 || '-';
                    document.getElementById('member-info-section').classList.remove('hidden');
                } else {
                    document.getElementById('card-name').innerText = "尚未綁定";
                    document.getElementById('bind-section').classList.remove('hidden');
                }
            });
        
        // 載入訂單
        fetch(`${GAS_URL}?action=getOrders&lineId=${currentLineId}`)
            .then(res => res.json())
            .then(res => {
                if (res.status === "success" && res.data.length > 0) {
                    document.getElementById('order-list').innerHTML = res.data.map(o => `
                        <div class="bg-gray-50 p-4 rounded-2xl text-xs space-y-1">
                            <div class="font-bold">訂單：${o.orderId} | ${o.payStatus}</div>
                            <div>商品：${o.items}</div>
                            <div>總計：${o.productTotal}</div>
                        </div>`).join('');
                } else {
                    document.getElementById('order-list').innerHTML = "<p class='text-center text-gray-400 py-4'>無訂單記錄</p>";
                }
            });
    }

    function submitBinding() {
        const phone = document.getElementById('bind-phone-input').value.trim();
        if (!phone) { alert("請輸入手機號碼"); return; }
        
        // 使用 fetch 呼叫綁定
        fetch(`${GAS_URL}?action=bindPhone&lineId=${currentLineId}&phone=${phone}`)
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                if (res.success) location.reload();
            });
    }

    window.showTab = function(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
    }

    window.onload = initLiff;
  </script>
</body>
</html>
