<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>肆木代購｜MokuWood.co 會員專區</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .filter-btn.active { background-color: #7C6F9D !important; color: #ffffff !important; border-color: #7C6F9D !important; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body style="background-color: #f9f8f3;" class="text-gray-800 text-sm antialiased min-h-screen py-6 px-4 pb-24">
  <div class="max-w-xl mx-auto space-y-5">
    
    <!-- 頂部標題 -->
    <div class="bg-white/90 border border-white/60 rounded-2xl p-4 shadow-sm flex justify-between items-center">
        <div>
            <h2 id="user-name" class="font-bold text-base text-gray-900">Hello, 載入中...</h2>
            <p class="text-xs text-gray-500">肆木代購｜MokuWood.co 會員專區</p>
        </div>
        <button onclick="location.reload()" class="bg-gray-100 text-gray-600 text-xs px-3 py-1.5 rounded-lg">🔄 更新</button>
    </div>

    <!-- 1. 首頁 -->
    <div id="home" class="tab-content active space-y-4">
        <div class="bg-white/90 border border-white/60 rounded-3xl p-5 shadow-sm text-xs space-y-2 text-gray-600 leading-relaxed">
            <p style="color: #8C7BAE;" class="font-bold text-sm mb-2 flex items-center gap-1.5">
                <span>💡</span> 購賣須知與使用說明
            </p>
            <div class="space-y-1.5 pl-1">
                <p>📢 本頁面僅公開顯示商品整體作業進度，不包含個人隱私訂單細節。</p>
                <p>💬 若有疑問請聯繫官方 LINE：<strong class="text-gray-900 font-semibold">@wrg3112r</strong></p>
            </div>
        </div>
        <div class="space-y-2">
            <p style="color: #7C6F9D;" class="text-xs font-bold px-1">快速篩選：依目前進度分類</p>
            <div id="filter-buttons" class="flex flex-wrap gap-2"></div>
        </div>
        <div id="card-container" class="space-y-4">
            <div class="bg-white border rounded-3xl p-8 text-center text-gray-400 text-xs">資料載入中...</div>
        </div>
    </div>

    <!-- 2. 賣場 (已修正：直接連結至試算表中的個別連結) -->
    <div id="shop" class="tab-content space-y-4">
        <div class="bg-white border rounded-3xl p-5 shadow-sm space-y-3">
            <h3 class="font-bold text-base text-gray-900 border-b pb-2">🛒 本期快速下單專區</h3>
            <div id="shop-list" class="space-y-2 text-xs text-gray-500">載入中...</div>
        </div>
    </div>

    <!-- 3. 訂單記錄 -->
    <div id="orders" class="tab-content space-y-4">
        <div class="bg-white border rounded-3xl p-5 shadow-sm space-y-3">
            <h3 class="font-bold text-base text-gray-900 border-b pb-2">📋 我的訂單記錄</h3>
            <div id="order-list" class="space-y-3 pt-2 text-xs text-gray-600">載入中...</div>
        </div>
    </div>

    <!-- 4. 會員資料 -->
    <div id="profile" class="tab-content space-y-4">
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-3xl p-6 shadow-md space-y-3">
            <p id="card-name" class="text-xl font-bold tracking-wide mt-0.5">載入中...</p>
        </div>

        <div id="member-info-section" class="hidden bg-white border border-gray-100 rounded-3xl p-5 shadow-sm space-y-3 text-xs">
            <div class="flex justify-between items-center py-2.5 border-b"><span class="text-gray-400">Email</span><span id="info-email" class="font-bold text-gray-900">--</span></div>
            <div class="flex justify-between items-center py-2.5"><span class="text-gray-400">收件人</span><span id="info-recipient" class="font-bold text-gray-900">--</span></div>
        </div>

        <div id="bind-section" class="hidden bg-white border border-gray-100 rounded-3xl p-6 shadow-sm space-y-4 text-xs">
            <p class="font-bold text-sm text-center">✨ 首次登入會員綁定</p>
            <input type="tel" id="bind-phone-input" placeholder="請輸入手機號碼" class="w-full px-4 py-3 border rounded-xl">
            <button onclick="submitBinding()" class="w-full py-3 bg-[#7C6F9D] text-white font-bold rounded-xl">確認綁定</button>
        </div>
    </div>
  </div>

  <nav class="fixed bottom-0 left-0 w-full bg-white/90 border-t flex justify-around py-3 z-50">
      <div id="nav-home" onclick="showTab('home')" class="text-xs font-bold text-[#7C6F9D] cursor-pointer">首頁</div>
      <div id="nav-shop" onclick="showTab('shop')" class="text-xs font-medium text-gray-400 cursor-pointer">賣場</div>
      <div id="nav-orders" onclick="showTab('orders')" class="text-xs font-medium text-gray-400 cursor-pointer">訂單</div>
      <div id="nav-profile" onclick="showTab('profile')" class="text-xs font-medium text-gray-400 cursor-pointer">會員資料</div>
  </nav>

  <script>
    const LIFF_ID = "2011022087-236uTcYQ";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz3H5WM7daQSxXyA9FR1RtMPMpfXVlYDMz6zpco48cXulIeauM006DMhfaRccLqNFo-/exec";

    // 核心修改：確保每個項目點擊時，連結到試算表中的「連結1」
    function renderShop(data) {
        document.getElementById('shop-list').innerHTML = data.map(item => {
            const shopUrl = item.連結1 || "#"; // 這裡直接抓取試算表的 K 欄 (連結1)
            const titleName = item['商品系列/名稱'] || item.title || "商品";
            return `
                <a href="${shopUrl}" target="_blank" class="block text-center bg-[#7C6F9D] text-white text-xs font-bold py-3 rounded-xl shadow-sm hover:opacity-90 transition mb-2">📦 ${titleName} 快速下單</a>
            `;
        }).join('');
    }

    // ... 其餘邏輯保持不變 ...
    async function initLiff() { /* ... */ }
    window.showTab = function(tabId) { /* ... */ }
    window.onload = function() { /* ... */ }
    // ...
  </script>
</body>
</html>
