<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>肆木代購進度</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">
  <div id="app" class="max-w-md mx-auto space-y-4">
    <h1 class="text-xl font-bold">商品進度總覽</h1>
    <div id="card-container" class="space-y-4">資料載入中...</div>
  </div>

  <script>
    // 【這裡填入你新的 GAS 網址】
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz3H5WM7daQSxXyA9FR1RtMPMpfXVlYDMz6zpco48cXulIeauM006DMhfaRccLqNFo-/exec";

    fetch(`${GAS_URL}?action=getProgress`)
      .then(res => res.json())
      .then(res => {
        const container = document.getElementById('card-container');
        container.innerHTML = res.data.map(item => `
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-start mb-2">
              <h2 class="font-bold text-lg">${item.title}</h2>
              <span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded-full">${item.tag}</span>
            </div>
            <div class="text-sm text-gray-600 space-y-1 mb-4">
              <p>截止：${item.deadline}</p>
              <p>匯款：${item.paymentDeadline}</p>
              <p class="text-gray-800 font-medium mt-2">${item.progressContent}</p>
            </div>
            <div class="flex gap-2">
              ${item.btn1Text ? `<a href="${item.btn1Link}" target="_blank" class="flex-1 bg-black text-white text-center py-2 rounded-lg text-sm font-bold">${item.btn1Text}</a>` : ''}
              ${item.btn2Text ? `<a href="${item.btn2Link}" target="_blank" class="flex-1 bg-gray-200 text-gray-700 text-center py-2 rounded-lg text-sm font-bold">${item.btn2Text}</a>` : ''}
            </div>
            <div class="text-[10px] text-gray-400 mt-3 text-right">更新於：${item.updateDate}</div>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
