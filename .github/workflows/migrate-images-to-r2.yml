name: Migrate images to R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install migration dependencies
        run: npm install --no-save @supabase/supabase-js dotenv

      - name: Copy Supabase product images through Cloudflare Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WORKER_URL: https://mokuwood-images.star13141313.workers.dev
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
        run: node scripts/migrate-images-to-r2.mjs
