<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MokuWood.co｜後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f7f5f1;color:#292724}
.admin-card{background:#fff;border:1px solid #eee7dc;border-radius:22px;box-shadow:0 5px 20px rgba(80,60,30,.05)}
.nav-active{background:#eee8f5;color:#7c6f9d;font-weight:700}
.badge{display:inline-flex;align-items:center;padding:.25rem .6rem;border-radius:999px;font-size:11px;font-weight:700}
input,select,textarea{outline:none}.field{width:100%;border:1px solid #e5e1db;border-radius:12px;padding:10px 12px;font-size:13px;background:#fff}.field:focus{border-color:#9b8bb5;box-shadow:0 0 0 3px rgba(124,111,157,.08)}
</style>
</head>
<body>
<div id="loginView" class="min-h-screen flex items-center justify-center p-5">
  <div class="admin-card w-full max-w-md p-7">
    <div class="text-center mb-7"><div class="text-2xl font-black tracking-widest">MokuWood.co</div><div class="text-xs text-gray-400 mt-2">ADMIN PANEL</div></div>
    <form id="loginForm" class="space-y-4">
      <div><label class="text-xs text-gray-500">Email</label><input id="loginEmail" type="email" class="field mt-1" required autocomplete="email"></div>
      <div><label class="text-xs text-gray-500">密碼</label><input id="loginPassword" type="password" class="field mt-1" required autocomplete="current-password"></div>
      <button class="w-full py-3 rounded-xl bg-[#7C6F9D] text-white text-sm font-bold">登入後台</button>
      <div id="loginMsg" class="hidden text-xs text-center rounded-xl px-3 py-2"></div>
    </form>
    <p class="text-[11px] text-gray-400 text-center mt-5">僅限具備 admin 權限的帳號使用</p>
  </div>
</div>

<div id="appView" class="hidden min-h-screen">
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div><div class="font-black tracking-wider">MokuWood.co</div><div class="text-[10px] text-gray-400">ADMIN PANEL</div></div>
      <div class="flex items-center gap-3"><span id="adminEmail" class="text-xs text-gray-500"></span><button id="logoutBtn" class="text-xs font-bold text-gray-600 px-3 py-2 rounded-xl bg-gray-100">⎋ 登出</button></div>
    </div>
  </header>
  <div class="max-w-7xl mx-auto px-4 py-5 flex gap-5">
    <aside class="hidden md:block w-48 shrink-0"><div class="admin-card p-2 sticky top-24" id="sideNav">
      <button data-tab="dashboard" class="w-full text-left px-4 py-3 rounded-xl text-sm nav-active">📊 儀表板</button>
      <button data-tab="products" class="w-full text-left px-4 py-3 rounded-xl text-sm">📦 商品</button>
      <button data-tab="orders" class="w-full text-left px-4 py-3 rounded-xl text-sm">🧾 訂單</button>
      <button data-tab="members" class="w-full text-left px-4 py-3 rounded-xl text-sm">👤 會員</button>
      <button data-tab="settings" class="w-full text-left px-4 py-3 rounded-xl text-sm">⚙️ 設定</button>
    </div></aside>
    <main class="flex-1 min-w-0">
      <div class="md:hidden mb-4"><select id="mobileNav" class="field"><option value="dashboard">📊 儀表板</option><option value="products">📦 商品</option><option value="orders">🧾 訂單</option><option value="members">👤 會員</option><option value="settings">⚙️ 設定</option></select></div>

      <section id="tab-dashboard" class="admin-tab space-y-5">
        <div><h1 class="text-xl font-black">儀表板</h1><p class="text-xs text-gray-400 mt-1">MokuWood 店務總覽</p></div>
        <div id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></div>
        <div class="grid lg:grid-cols-2 gap-5"><div class="admin-card p-5"><div class="font-bold text-sm mb-3">最近訂單</div><div id="recentOrders" class="space-y-2 text-xs"></div></div><div class="admin-card p-5"><div class="font-bold text-sm mb-3">待處理</div><div id="pendingOrders" class="space-y-2 text-xs"></div></div></div>
      </section>

      <section id="tab-products" class="admin-tab hidden space-y-5">
        <div class="flex items-center justify-between gap-3"><div><h1 class="text-xl font-black">商品管理</h1><p class="text-xs text-gray-400 mt-1">管理前台商品、庫存與運費</p></div><button id="newProductBtn" class="px-4 py-2.5 rounded-xl bg-[#7C6F9D] text-white text-xs font-bold">＋ 新增商品</button></div>
        <div class="admin-card p-4"><input id="productSearch" class="field" placeholder="搜尋商品名稱／品牌／商品 ID"></div>
        <div class="admin-card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-gray-50 text-gray-400"><tr><th class="text-left p-3">商品</th><th class="p-3">價格</th><th class="p-3">庫存</th><th class="p-3">狀態</th><th class="p-3">操作</th></tr></thead><tbody id="productRows"></tbody></table></div></div>
      </section>

      <section id="tab-orders" class="admin-tab hidden space-y-5">
        <div><h1 class="text-xl font-black">訂單管理</h1><p class="text-xs text-gray-400 mt-1">查看、搜尋與更新訂單狀態</p></div>
        <div class="admin-card p-4 flex flex-col md:flex-row gap-3"><input id="orderSearch" class="field" placeholder="搜尋訂單編號／姓名／電話／Email"><select id="orderStatusFilter" class="field md:max-w-xs"><option value="">全部訂單狀態</option><option>待處理</option><option>處理中</option><option>抵台</option><option>已完成</option><option>取消</option></select></div>
        <div id="orderRows" class="space-y-3"></div>
      </section>

      <section id="tab-members" class="admin-tab hidden space-y-5">
        <div><h1 class="text-xl font-black">會員管理</h1><p class="text-xs text-gray-400 mt-1">會員資料、LINE 綁定與 LV</p></div>
        <div class="admin-card p-4"><input id="memberSearch" class="field" placeholder="搜尋姓名／Email／電話／LINE ID"></div>
        <div class="admin-card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-gray-50 text-gray-400"><tr><th class="text-left p-3">會員</th><th class="p-3">電話</th><th class="p-3">門市</th><th class="p-3">等級</th><th class="p-3">LINE</th><th class="p-3">操作</th></tr></thead><tbody id="memberRows"></tbody></table></div></div>
      </section>

      <section id="tab-settings" class="admin-tab hidden space-y-5">
        <div><h1 class="text-xl font-black">系統設定</h1><p class="text-xs text-gray-400 mt-1">先保留設定介面，避免直接改動既有前台邏輯</p></div>
        <div class="admin-card p-5 space-y-4"><div><div class="font-bold text-sm">會員等級</div><p class="text-xs text-gray-400 mt-1">LV = 累積完成購買商品件數；LV.0 起始。</p></div><div class="grid md:grid-cols-2 gap-3"><div><label class="text-xs text-gray-500">客服 LINE</label><input id="settingLine" class="field mt-1" value="@wrg3112r"></div><div><label class="text-xs text-gray-500">賣貨便運費（參考）</label><input id="settingShipping" class="field mt-1" value="38"></div></div><button id="saveSettings" class="px-4 py-2.5 rounded-xl bg-[#7C6F9D] text-white text-xs font-bold">儲存設定（目前僅本機）</button><div id="settingsMsg" class="text-xs text-green-600"></div></div>
      </section>
    </main>
  </div>
</div>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/40 p-4 overflow-y-auto"><div class="max-w-2xl mx-auto mt-8 admin-card p-5"><div class="flex justify-between items-center mb-4"><h2 id="modalTitle" class="font-black"></h2><button onclick="closeModal()" class="text-gray-400 text-xl">×</button></div><div id="modalBody"></div></div></div>

<script>
const SUPABASE_URL="https://mtbulnwrsktwdmwbugxt.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_tFzhuE0GlFuVbPYFgscAWw_Y9sZ86PQ";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let session=null,products=[],orders=[],members=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const money=v=>"NT$"+(Number(v)||0).toLocaleString();
function headers(extra){
  const accessToken = session?.access_token || SUPABASE_PUBLISHABLE_KEY;
  return Object.assign({
    apikey:SUPABASE_PUBLISHABLE_KEY,
    Authorization:"Bearer "+accessToken,
    "Content-Type":"application/json"
  },extra||{});
}
function adminAllowed(user){return user && user.app_metadata && user.app_metadata.role==="admin";}
function msg(text,type="error"){const el=$("loginMsg");el.textContent=text;el.className="text-xs text-center rounded-xl px-3 py-2 "+(type==="ok"?"bg-green-50 text-green-600":"bg-red-50 text-red-500");el.classList.remove("hidden");}
async function login(e){e.preventDefault();msg("登入中…","ok");const {data,error}=await sb.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPassword").value});if(error){msg(error.message);return}if(!adminAllowed(data.user)){await sb.auth.signOut();msg("此帳號沒有後台管理權限。請在 Supabase Auth 的 app_metadata 設定 role=admin。");return}await start(data.session);}
async function start(s){session=s;$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");$("adminEmail").textContent=session.user.email||"";await loadAll();}
async function api(path,opts={}){const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,Object.assign({headers:headers()},opts));if(!r.ok){const t=await r.text();throw new Error(t||("HTTP "+r.status))}return r.status===204?null:r.json();}
async function loadAll(){await Promise.all([loadProducts(),loadOrders(),loadMembers()]);renderDashboard();}
async function loadProducts(){try{products=await api("products?select=*&order=created_at.desc");if(!Array.isArray(products))products=[];renderProducts();}catch(e){console.error(e);products=[];$("productRows").innerHTML='<tr><td colspan="5" class="p-6 text-center text-red-400">商品資料無法讀取：'+esc(e.message)+'</td></tr>';}}
async function loadOrders(){try{orders=await api("orders?select=*&order=created_at.desc");if(!Array.isArray(orders))orders=[];renderOrders();}catch(e){console.error(e);orders=[];$("orderRows").innerHTML='<div class="admin-card p-6 text-center text-red-400">訂單資料無法讀取：'+esc(e.message)+'</div>';}}
async function loadMembers(){
  try{
    members=await api("member_profiles?select=user_id,email,recipient_name,recipient_phone,pickup_store,pickup_store_code,member_level,line_user_id,created_at&order=created_at.desc");
    if(!Array.isArray(members))members=[];
    renderMembers();
  }catch(e){
    console.error(e);
    members=[];
    $("memberRows").innerHTML='<tr><td colspan="6" class="p-6 text-center text-red-400">會員資料無法讀取：'+esc(e.message)+'</td></tr>';
  }
}
function renderDashboard(){const pending=orders.filter(o=>String(o.payment_status||"").includes("待")||String(o.order_status||"").includes("待"));$("stats").innerHTML=[["今日訂單",orders.filter(o=>String(o.created_at||"").slice(0,10)===new Date().toISOString().slice(0,10)).length,"📋"],["待處理",pending.length,"⏳"],["會員",members.length,"👤"],["商品",products.length,"📦"]].map(x=>`<div class="admin-card p-5"><div class="text-2xl">${x[2]}</div><div class="text-2xl font-black mt-2">${x[1]}</div><div class="text-xs text-gray-400 mt-1">${x[0]}</div></div>`).join("");$("recentOrders").innerHTML=orders.slice(0,6).map(o=>`<button class="w-full text-left flex justify-between gap-3 p-3 rounded-xl bg-gray-50" onclick="openOrder('${esc(o.order_no||o.order_id)}')"><span><b>${esc(o.order_no||o.order_id||"-")}</b><br><span class="text-gray-400">${esc(o.customer_name||o.recipient_name||o.line_id||"")}</span></span><span class="badge bg-white">${esc(o.order_status||"待處理")}</span></button>`).join("")||'<div class="text-gray-400">尚無訂單</div>';$('pendingOrders').innerHTML=orders.filter(o=>String(o.order_status||"").includes("待")||String(o.payment_status||"").includes("待")).slice(0,6).map(o=>`<button class="w-full text-left p-3 rounded-xl bg-amber-50" onclick="openOrder('${esc(o.order_no||o.order_id)}')"><b>${esc(o.order_no||o.order_id)}</b><span class="ml-2 text-gray-500">${esc(o.payment_status||o.order_status||"待處理")}</span></button>`).join("")||'<div class="text-gray-400">目前沒有待處理</div>';}
function renderProducts(){const q=$("productSearch").value.trim().toLowerCase();const rows=products.filter(p=>(String(p.name)+String(p.brand)+String(p.product_id)).toLowerCase().includes(q));$("productRows").innerHTML=rows.map(p=>`<tr class="border-t border-gray-100"><td class="p-3"><div class="flex items-center gap-3"><img src="${esc(p.image||"")}" class="w-10 h-10 rounded-lg object-cover bg-gray-100" onerror="this.style.display='none'"><div><b>${esc(p.name)}</b><div class="text-[10px] text-gray-400">${esc(p.brand||"")} · ${esc(p.product_id||"")}</div></div></div></td><td class="p-3 text-center">${money(p.price)}</td><td class="p-3 text-center">${esc(p.stock??0)}</td><td class="p-3 text-center"><span class="badge ${String(p.status||"").includes("上架")?"bg-green-50 text-green-600":"bg-gray-100 text-gray-500"}">${esc(p.status||"-")}</span></td><td class="p-3 text-center"><button class="text-[#7C6F9D] font-bold" onclick="editProduct('${esc(p.product_id)}')">編輯</button></td></tr>`).join("")||'<tr><td colspan="5" class="p-6 text-center text-gray-400">沒有商品</td></tr>';}
function renderOrders(){const q=$("orderSearch").value.trim().toLowerCase(),f=$("orderStatusFilter").value;const rows=orders.filter(o=>(!f||String(o.order_status||"")===f)&&(!q||JSON.stringify(o).toLowerCase().includes(q)));$("orderRows").innerHTML=rows.map(o=>`<div class="admin-card p-4"><div class="flex justify-between gap-3"><button class="text-left flex-1" onclick="openOrder('${esc(o.order_no||o.order_id)}')"><div class="font-black">${esc(o.order_no||o.order_id||"-")}</div><div class="text-xs text-gray-400 mt-1">${esc(o.customer_name||o.recipient_name||"")} ${esc(o.recipient_phone||"")}</div><div class="text-xs text-gray-500 mt-2">${esc(o.order_status||"待處理")} · ${esc(o.payment_status||"待付款")} · ${esc(o.shipping_status||"-")}</div></button><div class="text-right"><div class="font-bold">${money(o.first_stage_total??o.product_total)}</div><button class="mt-2 px-3 py-2 rounded-lg bg-gray-100 text-xs" onclick="openOrder('${esc(o.order_no||o.order_id)}')">查看</button></div></div></div>`).join("")||'<div class="admin-card p-6 text-center text-gray-400">沒有符合的訂單</div>';}
function renderMembers(){const q=$("memberSearch").value.trim().toLowerCase();const rows=members.filter(m=>JSON.stringify(m).toLowerCase().includes(q));$("memberRows").innerHTML=rows.map(m=>`<tr class="border-t border-gray-100"><td class="p-3"><b>${esc(m.recipient_name||"-")}</b><div class="text-[10px] text-gray-400">${esc(m.email||"")}</div></td><td class="p-3 text-center">${esc(m.recipient_phone||"-")}</td><td class="p-3 text-center">${esc(m.pickup_store||"-")}<div class="text-[10px] text-gray-400">${esc(m.pickup_store_code||"")}</div></td><td class="p-3 text-center"><span class="badge bg-[#f8f1df] text-[#9a7a2f]">${esc(m.member_level||"LV.0")}</span></td><td class="p-3 text-center">${m.line_user_id?"✓":"—"}</td><td class="p-3 text-center"><button class="text-[#7C6F9D] font-bold" onclick="openMember('${esc(m.user_id)}')">查看</button></td></tr>`).join("")||'<tr><td colspan="6" class="p-6 text-center text-gray-400">沒有會員</td></tr>';}
async function editProduct(id){const p=products.find(x=>String(x.product_id)===String(id));if(!p)return;showModal("編輯商品",`<form id="productForm" class="space-y-3"><div class="grid md:grid-cols-2 gap-3"><div><label class="text-xs text-gray-500">商品 ID</label><input class="field mt-1" value="${esc(p.product_id)}" disabled></div><div><label class="text-xs text-gray-500">品牌</label><input name="brand" class="field mt-1" value="${esc(p.brand||"")}"></div></div><div><label class="text-xs text-gray-500">商品名稱</label><input name="name" class="field mt-1" value="${esc(p.name||"")}" required></div><div class="grid md:grid-cols-3 gap-3"><div><label class="text-xs text-gray-500">價格</label><input name="price" type="number" class="field mt-1" value="${Number(p.price)||0}"></div><div><label class="text-xs text-gray-500">庫存</label><input name="stock" type="number" class="field mt-1" value="${Number(p.stock)||0}"></div><div><label class="text-xs text-gray-500">狀態</label><input name="status" class="field mt-1" value="${esc(p.status||"")}"></div></div><div><label class="text-xs text-gray-500">圖片</label><input name="image" class="field mt-1" value="${esc(p.image||"")}"></div><div><label class="text-xs text-gray-500">商品描述</label><textarea name="description" class="field mt-1" rows="4">${esc(p.description||"")}</textarea></div><button class="w-full py-3 rounded-xl bg-[#7C6F9D] text-white text-xs font-bold">儲存商品</button></form>`);$("productForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const body={brand:fd.get("brand"),name:fd.get("name"),price:Number(fd.get("price"))||0,stock:Number(fd.get("stock"))||0,status:fd.get("status"),image:fd.get("image"),description:fd.get("description")};try{await api("products?product_id=eq."+encodeURIComponent(id),{method:"PATCH",headers:headers({Prefer:"return=minimal"}),body:JSON.stringify(body)});closeModal();await loadProducts();renderDashboard();alert("商品已更新");}catch(err){alert("更新失敗："+err.message)}};}
function openOrder(id){const o=orders.find(x=>String(x.order_no||x.order_id)===String(id));if(!o)return;showModal("訂單 "+(o.order_no||o.order_id),`<div class="space-y-4"><div class="grid md:grid-cols-2 gap-3 text-xs"><div class="bg-gray-50 rounded-xl p-3"><span class="text-gray-400">會員</span><div class="font-bold mt-1">${esc(o.customer_name||o.recipient_name||"-")}</div></div><div class="bg-gray-50 rounded-xl p-3"><span class="text-gray-400">電話</span><div class="font-bold mt-1">${esc(o.recipient_phone||"-")}</div></div><div class="bg-gray-50 rounded-xl p-3"><span class="text-gray-400">第一階段</span><div class="font-bold mt-1">${money(o.first_stage_total??o.product_total)}</div></div><div class="bg-gray-50 rounded-xl p-3"><span class="text-gray-400">匯款後五碼</span><div class="font-bold mt-1">${esc(o.payment_last5||o.transfer_last5||"-")}</div></div></div><div class="grid md:grid-cols-3 gap-3"><label class="text-xs text-gray-500">訂單狀態<select id="editOrderStatus" class="field mt-1"><option>${esc(o.order_status||"待處理")}</option><option>待處理</option><option>處理中</option><option>抵台</option><option>已完成</option><option>取消</option></select></label><label class="text-xs text-gray-500">付款狀態<input id="editPaymentStatus" class="field mt-1" value="${esc(o.payment_status||"")}"></label><label class="text-xs text-gray-500">物流狀態<input id="editShippingStatus" class="field mt-1" value="${esc(o.shipping_status||"")}"></label></div><div class="grid md:grid-cols-2 gap-3"><label class="text-xs text-gray-500">第二階段運費<input id="editSecondFee" type="number" class="field mt-1" value="${Number(o.second_stage_total||o.second_payment_amount)||0}"></label><label class="text-xs text-gray-500">物流單號<input id="editTracking" class="field mt-1" value="${esc(o.tracking_number||"")}"></label></div><button onclick="saveOrder('${esc(o.order_no||o.order_id)}')" class="w-full py-3 rounded-xl bg-[#7C6F9D] text-white text-xs font-bold">儲存訂單</button></div>`);}
async function saveOrder(id){const o=orders.find(x=>String(x.order_no||x.order_id)===String(id));if(!o)return;const body={order_status:$("editOrderStatus").value,payment_status:$("editPaymentStatus").value,shipping_status:$("editShippingStatus").value,tracking_number:$("editTracking").value};const fee=Number($("editSecondFee").value)||0;if("second_stage_total" in o)body.second_stage_total=fee;else if("second_payment_amount" in o)body.second_payment_amount=fee;try{await api("orders?order_no=eq."+encodeURIComponent(id),{method:"PATCH",headers:headers({Prefer:"return=minimal"}),body:JSON.stringify(body)});closeModal();await loadOrders();renderDashboard();alert("訂單已更新");}catch(err){alert("更新失敗："+err.message)}}
function openMember(id){const m=members.find(x=>String(x.user_id)===String(id));if(!m)return;showModal("會員資料",`<div class="space-y-3 text-sm"><div><span class="text-gray-400">姓名</span><div class="font-bold">${esc(m.recipient_name||"-")}</div></div><div><span class="text-gray-400">Email</span><div class="font-bold break-all">${esc(m.email||"-")}</div></div><div><span class="text-gray-400">電話</span><div class="font-bold">${esc(m.recipient_phone||"-")}</div></div><div><span class="text-gray-400">取件門市</span><div class="font-bold">${esc(m.pickup_store||"-")} / ${esc(m.pickup_store_code||"-")}</div></div><div><span class="text-gray-400">LINE</span><div class="font-bold break-all">${esc(m.line_user_id||"尚未綁定")}</div></div><div><span class="text-gray-400">會員等級</span><div class="font-bold text-[#9a7a2f]">${esc(m.member_level||"LV.0")}</div></div></div>`);}
function showModal(title,body){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modal").classList.remove("hidden");}function closeModal(){$("modal").classList.add("hidden");}
function switchTab(tab){document.querySelectorAll(".admin-tab").forEach(x=>x.classList.add("hidden"));$("tab-"+tab).classList.remove("hidden");document.querySelectorAll("#sideNav button").forEach(x=>x.classList.remove("nav-active"));const b=document.querySelector(`#sideNav button[data-tab="${tab}"]`);if(b)b.classList.add("nav-active");$("mobileNav").value=tab;if(tab==="products")loadProducts();if(tab==="orders")loadOrders();if(tab==="members")loadMembers();}
$("loginForm").addEventListener("submit",login);$("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelectorAll("#sideNav button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$("mobileNav").onchange=e=>switchTab(e.target.value);$("productSearch").oninput=renderProducts;$("orderSearch").oninput=renderOrders;$("orderStatusFilter").onchange=renderOrders;$("memberSearch").oninput=renderMembers;$("newProductBtn").onclick=()=>alert("新增商品介面下一版接上，先避免影響現有 products 資料。");$("saveSettings").onclick=()=>{$("settingsMsg").textContent="已儲存本機設定（尚未寫入資料庫）。"};
(async()=>{const {data}=await sb.auth.getSession();if(data.session&&adminAllowed(data.session.user))await start(data.session);})();
</script>
</body>
</html>
